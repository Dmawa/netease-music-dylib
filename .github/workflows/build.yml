name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'          # 纯文档改动不必占用 macOS runner
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译 + 注入 + 打包
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: 编译 Player.dylib（arm64 + arm64e）
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          SRCS=$(find src -name '*.m' | sort)
          for ARCH in arm64 arm64e; do
            echo "==> $ARCH"
            xcrun --sdk iphoneos clang -arch $ARCH -isysroot "$SDK" \
              -miphoneos-version-min=13.0 \
              -fobjc-arc -fblocks -dynamiclib \
              -I src -I src/Core -I src/UI -I src/Support \
              -Wall -Wno-unused-parameter -Wno-deprecated-declarations \
              -framework Foundation -framework UIKit -framework AVFoundation \
              -framework MediaPlayer -framework QuartzCore -framework CoreGraphics \
              -framework CoreMedia -framework Security -framework WebKit \
              -install_name /usr/lib/Player.dylib \
              -o out/Player.$ARCH.dylib $SRCS
          done
          lipo -create out/Player.arm64.dylib out/Player.arm64e.dylib -output out/Player.dylib
          lipo -info out/Player.dylib
          otool -L out/Player.dylib
          codesign --force --sign - --timestamp=none out/Player.dylib
          codesign -dv out/Player.dylib 2>&1 || true

      - name: 编译空壳宿主 App
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p shell/Payload/NEMusicShell.app
          APP=shell/Payload/NEMusicShell.app
          cp shell-app/Info.plist "$APP/Info.plist"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=13.0 -fobjc-arc \
            -framework Foundation -framework UIKit \
            -o "$APP/NEMusicShell" shell-app/Sources/main.m
          printf 'APPL????' > "$APP/PkgInfo"
          lipo -info "$APP/NEMusicShell"

      - name: 注入 dylib 并重签
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet lief
          python scripts/inject_app.py \
            --app shell/Payload/NEMusicShell.app \
            --dylib out/Player.dylib
          test -f shell/Payload/NEMusicShell.app/Player.dylib
          otool -L shell/Payload/NEMusicShell.app/NEMusicShell | grep -q '@executable_path/Player.dylib'
          echo "==> 注入校验通过"
          codesign --force --sign - shell/Payload/NEMusicShell.app/Player.dylib
          codesign --force --sign - --entitlements scripts/ent.plist shell/Payload/NEMusicShell.app || \
            codesign --force --sign - shell/Payload/NEMusicShell.app
          mkdir -p dist
          (cd shell && zip -qry ../dist/NEMusicShell.ipa Payload)
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Player.dylib
          path: out/Player.dylib
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: NEMusicShell.ipa
          path: dist/NEMusicShell.ipa
          if-no-files-found: error
